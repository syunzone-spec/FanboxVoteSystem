<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リクエスト投票所</title>
    <meta property="og:title" content="リクエスト投票所">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://syunzone-spec.github.io/FanboxVoteSystem/vote_public.html">
    <meta property="og:image" content="https://syunzone-spec.github.io/FanboxVoteSystem/img/vote_public.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="リクエスト投票所">
    <meta name="twitter:image" content="https://syunzone-spec.github.io/FanboxVoteSystem/img/vote_public.png">
    <link rel="stylesheet" href="common.css">
    <style>
        .daily-luck { font-size: 1.2em; font-weight: bold; color: var(--color-primary-hover); margin: 10px 0; }
        .daily-luck span { font-size: 1.5em; color: #d9534f; }
        .notice-divider { border: 0; border-top: 1px dashed var(--color-border); margin: 15px 0; }
        .notice-warning { color: #d9534f; font-size: 0.9em; font-weight: bold; }
    </style>
    <!-- 人間確認（Cloudflare Turnstile）。window.turnstile は typeof ガードしてから使用する -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="theme-public">
    <h2>一般投票所</h2>

    <div class="top-link">
        <a href="result.html" target="_blank">📊 現在の順位を確認する</a>
    </div>

    <div class="notice-box">
        <p>どなたでも1日1回投票可能です！</p>
        <div class="schedule-info" id="schedule-area"></div>
        <hr class="notice-divider">
        <p class="notice-warning">
            【ご注意】<br>
            公平性を保つため、不自然な連続投票や不正と検知した票は<BR>集計時に無効とさせていただく場合があります。
        </p>
    </div>

    <div id="vote-section" class="box">
        <p>下のボタンを押して、今日の投票力を決定します。</p>
        <button id="pull-btn" disabled>読み込み中...</button>

        <div id="result-area" class="hidden">
            <div id="gacha-ball-display"></div>
            <div class="daily-luck">
                今日の投票力： <span id="current-weight">?</span>pt <small id="weight-rank"></small>
            </div>
            <hr>
            <div id="captcha-area"></div>
            <div id="captcha-error" class="error-msg hidden"></div>
            <p>投票先を選んでください（リストはランダム順）</p>
            <div id="candidates-list"></div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        var currentWeight = 1;
        var candidatesData = [];
        var gachaData = null;

        // 人間確認（CAPTCHA）状態
        var captchaRequired = false;   // GET 応答 data.captcha_required（ON/OFF）
        var captchaToken = '';         // 成功 callback で受け取った token
        var captchaWidgetId = null;    // turnstile.render の戻り
        var captchaLoadFailed = false; // 読み込み/描画/error-callback 失敗

        document.addEventListener('DOMContentLoaded', async function() {
            getOrCreateUUID();

            try {
                var ip = await getIpAddress();
                var ua = navigator.userAgent;

                var json = await apiGet({
                    mode: 'public_vote',
                    ip: ip,
                    ua: ua
                });

                if (!json) return; // maintenance handled by apiGet

                if (json.data && json.data.schedule) {
                    renderSchedule(document.getElementById('schedule-area'), json.data.schedule);
                }

                captchaRequired = !!(json.data && json.data.captcha_required);
                gachaData = json.data.my_gacha;
                candidatesData = json.data.candidates;

                if (gachaData) {
                    currentWeight = gachaData.weight;
                }

                var pullBtn = document.getElementById('pull-btn');
                pullBtn.disabled = false;
                pullBtn.innerText = '抽選開始';

            } catch(e) {
                console.error(e);
                document.getElementById('pull-btn').innerText = '読み込みエラー';
            }
        });

        document.getElementById('pull-btn').addEventListener('click', function() {
            this.classList.add('hidden');
            var area = document.getElementById('result-area');
            area.classList.remove('hidden');

            if (gachaData) {
                var ball = document.getElementById('gacha-ball-display');
                ball.className = 'gacha-ball ball-' + gachaData.rank;
                ball.innerText = gachaData.rank;

                document.getElementById('current-weight').innerText = currentWeight;
                document.getElementById('weight-rank').innerText = '(' + gachaData.rank + ')';
            } else {
                document.getElementById('current-weight').innerText = '?';
            }

            var shuffled = shuffleArray([].concat(candidatesData));
            renderCandidates(shuffled);

            // 人間確認 widget を描画（captchaRequired=true のときのみ）
            setupCaptcha();
        });

        function renderCandidates(list) {
            var container = document.getElementById('candidates-list');
            container.innerHTML = "";
            list.forEach(function(item) {
                var div = document.createElement('div');
                div.className = 'candidate-card';
                div.innerHTML =
                    '<div><strong>' + esc(item.character) + '</strong><br><small>' + esc(item.theme) + '</small></div>' +
                    '<button class="vote-btn">投票 (' + currentWeight + 'pt)</button>';
                div.querySelector('.vote-btn').addEventListener('click', function() {
                    vote(item.id, item.character);
                });
                container.appendChild(div);
            });
            // token 状態に応じて投票ボタンの活性を反映（未取得時は非活性）
            updateVoteButtons();
        }

        // ==========================================
        // 人間確認（CAPTCHA / Cloudflare Turnstile）
        // ==========================================
        function showCaptchaError(message) {
            var el = document.getElementById('captcha-error');
            if (!el) return;
            if (message) {
                el.textContent = message;
                el.classList.remove('hidden');
            } else {
                el.textContent = '';
                el.classList.add('hidden');
            }
        }

        function updateVoteButtons() {
            var ready = !captchaRequired || (!captchaLoadFailed && !!captchaToken);
            document.querySelectorAll('.vote-btn').forEach(function(b) { b.disabled = !ready; });
        }

        function resetCaptcha() {
            captchaToken = '';
            if (captchaRequired && captchaWidgetId !== null && typeof window.turnstile !== 'undefined') {
                try { turnstile.reset(captchaWidgetId); } catch (e) {}
            }
            updateVoteButtons();
        }

        function setupCaptcha() {
            if (!captchaRequired) return;                    // OFF 時は何もしない（現行挙動）
            renderCaptchaWhenReady(0);
        }

        // api.js は async defer のため未ロードの可能性がある。
        // 一定時間（約5秒）待っても window.turnstile が現れない場合のみ「読み込み失敗」とする。
        // 読み込み中の早すぎる失敗判定で正規利用者をブロックしないため。
        function renderCaptchaWhenReady(attempt) {
            if (typeof window.turnstile === 'undefined') {
                if (attempt >= 25) {                         // 約5秒（200ms × 25）
                    captchaLoadFailed = true;
                    showCaptchaError('人間確認を読み込めませんでした。再読み込みしてください。');
                    updateVoteButtons();
                    return;
                }
                setTimeout(function() { renderCaptchaWhenReady(attempt + 1); }, 200);
                return;
            }
            try {
                captchaWidgetId = turnstile.render('#captcha-area', {
                    sitekey: TURNSTILE_SITE_KEY,
                    action: 'vote_public',
                    callback: function(token) {               // 取得成功
                        captchaToken = token;
                        captchaLoadFailed = false;
                        showCaptchaError('');
                        updateVoteButtons();
                    },
                    'expired-callback': function() {          // 期限切れ → token 失効
                        captchaToken = '';
                        updateVoteButtons();
                        if (captchaWidgetId !== null && typeof window.turnstile !== 'undefined') {
                            try { turnstile.reset(captchaWidgetId); } catch (e) {}
                        }
                    },
                    'error-callback': function() {            // 読み込み/実行エラー
                        // 独自案内を表示し投票ボタンを非活性化する。戻り値には依存しない。
                        captchaToken = '';
                        captchaLoadFailed = true;
                        showCaptchaError('人間確認を読み込めませんでした。再読み込みしてください。');
                        updateVoteButtons();
                    }
                });
            } catch (e) {
                captchaLoadFailed = true;
                showCaptchaError('人間確認を読み込めませんでした。再読み込みしてください。');
                updateVoteButtons();
            }
        }

        async function vote(targetId, charName) {
            if(!confirm('「' + charName + '」に投票しますか？\n(本日の投票力: ' + currentWeight + 'pt)')) return;

            // 人間確認ガード（多重）。captchaRequired=false 時はスキップ。
            if (captchaRequired) {
                if (captchaLoadFailed || typeof window.turnstile === 'undefined') {
                    alert('人間確認を読み込めませんでした。再読み込みしてください。');
                    return; // POST しない
                }
                var preToken = captchaToken ||
                    (captchaWidgetId !== null && typeof window.turnstile !== 'undefined'
                        ? turnstile.getResponse(captchaWidgetId) : '');
                if (!preToken) {
                    alert('人間確認が完了していません。完了するまでお待ちいただくか、ページを再読み込みしてください。');
                    return; // POST しない
                }
            }

            var btns = document.querySelectorAll('.vote-btn');
            btns.forEach(function(b) { b.disabled = true; });

            try {
                var ip = await getIpAddress();
                var postData = {
                    action: 'submit_vote_public',
                    target_request_id: targetId,
                    ip_address: ip,
                    user_agent: navigator.userAgent,
                    screen_info: window.screen.width + 'x' + window.screen.height,
                    device_uuid: getOrCreateUUID()
                };
                if (captchaRequired) {
                    postData.captcha_token = captchaToken ||
                        (captchaWidgetId !== null && typeof window.turnstile !== 'undefined'
                            ? turnstile.getResponse(captchaWidgetId) : '');
                }
                var result = await apiPost(postData);

                if (result.status === 'success') {
                    var finalWeight = result.result_detail ? result.result_detail.weight : currentWeight;
                    alert(finalWeight + 'pt で投票しました！\n明日の投票もお待ちしています。');
                    location.href = 'result.html';
                } else if (result.status === 'maintenance') {
                    showMaintenance(result.message);
                } else {
                    alert(result.message);
                    // token は使い捨て。失敗時は再取得（captchaRequired=false 時はボタン再活性のみ）。
                    if (captchaRequired) { resetCaptcha(); }
                    else { btns.forEach(function(b) { b.disabled = false; }); }
                }
            } catch(e) {
                alert("通信エラー");
                if (captchaRequired) { resetCaptcha(); }
                else { btns.forEach(function(b) { b.disabled = false; }); }
            }
        }
    </script>
</body>
</html>
