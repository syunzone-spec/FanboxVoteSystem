<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>差分投票</title>
    <meta property="og:title" content="差分投票">
    <meta property="og:description" content="差分の投票所です。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://syunzone-spec.github.io/FanboxVoteSystem/vote_variant.html">
    <meta property="og:image" content="https://syunzone-spec.github.io/FanboxVoteSystem/img/vote_variant.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="差分投票">
    <meta name="twitter:image" content="https://syunzone-spec.github.io/FanboxVoteSystem/img/vote_variant.png">
    <link rel="stylesheet" href="common.css">
    <style>
        /* 一括抽選一覧は common.css の .draw-* を使用 */
        .desc-text { font-size: 0.9em; color: var(--color-subtext); text-align: center; }
        #loading-msg { margin-bottom: 20px; color: var(--color-subtext); }
        #vote-section, #done-section { text-align: center; }
        .card-info { flex: 1; margin-right: 10px; }
        .badge { display: inline-block; background: #e9ecef; color: #495057; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; margin-bottom: 4px; font-weight: bold; }
    </style>
</head>
<body class="theme-support">

    <h2>🗳️ 差分投票所</h2>

    <div class="top-link">
        <a href="result_variant.html" target="_blank">📊 現在の順位を確認する</a>
    </div>

    <div class="notice-box">
        <p>支援者限定の差分投票所です。認証後に投票できます。</p>
        <div class="schedule-info" id="schedule-area"></div>
    </div>

    <div id="login-section" class="box login-box">
        <h3>支援者認証</h3>
        <p class="desc-text">Fanboxの支援者IDと合言葉を入力してください。</p>
        <input type="number" id="pixiv-id" placeholder="Pixiv ID (数字)">
        <input type="text" id="pixiv-name" placeholder="Pixivユーザー名 (集計用)">
        <input type="text" id="monthly-pass" placeholder="今月の合言葉">
        <button id="login-btn" class="btn-auth">認証して進む</button>
        <div id="login-error" class="error-msg hidden"></div>
    </div>

    <div id="loading-msg" class="hidden">
        認証中...
    </div>

    <div id="vote-section" class="box hidden">
        <p class="desc-text">下のボタンを押すと、今回の抽選結果が表示されます。<br>合計票数を1つの候補へまとめて投票します。</p>
        <button id="show-draw-btn">抽選結果を表示</button>

        <div id="draw-area" class="hidden">
            <h3>今回の抽選結果</h3>
            <div class="draw-list" id="draw-list"></div>
            <p class="draw-total">合計 <strong><span id="total-weight"></span></strong> 票</p>
            <hr>
            <p class="desc-text">この合計票数を投票する候補を1つ選んでください（順不同）</p>
            <div id="candidates-list"></div>
        </div>

        <div class="logout-link" onclick="confirmLogoutSupporter('ログアウトしますか？（次回ID入力が必要になります）')">IDを変更する（ログアウト）</div>
    </div>

    <div id="done-section" class="box hidden">
        <h3>🎉 投票完了 🎉</h3>
        <p>投票が完了しました！<br>ありがとうございました！</p>
        <button onclick="location.href='result_variant.html'">結果を見る</button>

        <div class="logout-link" onclick="confirmLogoutSupporter('ログアウトしますか？（次回ID入力が必要になります）')">IDを変更する（ログアウト）</div>
    </div>

    <script src="common.js"></script>
    <script>
        var currentUser = null;
        var candidatesData = [];
        var bundleData = null;

        document.addEventListener('DOMContentLoaded', async function() {
            getOrCreateUUID();

            // 認証前の先行メンテナンス確認 GET + schedule取得
            try {
                var check = await apiGet({ mode: 'variant_init' });
                if (!check) return; // maintenance handled by apiGet
                if (check.data && check.data.schedule) {
                    renderSchedule(document.getElementById('schedule-area'), check.data.schedule);
                }
            } catch(e) {
                console.error(e);
            }

            var sup = loadSupporter();
            if(sup.pid && sup.pass) {
                document.getElementById('pixiv-id').value = sup.pid;
                document.getElementById('monthly-pass').value = sup.pass;
                if(sup.name) document.getElementById('pixiv-name').value = sup.name;
                // ユーザー名が空の場合は自動ログインせず手動入力させる（空名のまま認証通過を防ぐ）
                if(sup.name) doLogin(sup.pid, sup.pass, sup.name);
            }
        });

        document.getElementById('login-btn').addEventListener('click', function() {
            var pid = document.getElementById('pixiv-id').value;
            var pass = document.getElementById('monthly-pass').value;
            var name = document.getElementById('pixiv-name').value;

            if(!pid) return alert("Pixiv IDを入力してください");
            if(!pass) return alert("合言葉を入力してください");
            if(!name) return alert("Pixivユーザー名を入力してください");

            doLogin(pid, pass, name);
        });

        async function doLogin(pid, pass, name) {
            // 手動・自動どちらの経路でも空のユーザー名を弾く（集計・識別用の値のため）
            if(!name) return alert("Pixivユーザー名を入力してください");

            var loginBox = document.getElementById('login-section');
            var loadingMsg = document.getElementById('loading-msg');
            var btn = document.getElementById('login-btn');

            loginBox.classList.add('hidden');
            loadingMsg.classList.remove('hidden');
            btn.disabled = true;

            try {
                var json = await apiGet({ mode: 'variant_init', pixiv_id: pid, password: pass });

                loadingMsg.classList.add('hidden');

                if (!json) return; // maintenance handled by apiGet

                if(json.status === 'success') {
                    // 認証成功時のみ保存
                    saveSupporter(pid, pass, name);
                    currentUser = json.data.user;
                    candidatesData = json.data.candidates || [];
                    bundleData = json.data.bundle || null;

                    if (currentUser.is_voted) {
                        document.getElementById('done-section').classList.remove('hidden');
                    } else {
                        document.getElementById('vote-section').classList.remove('hidden');
                    }
                } else {
                    alert(json.message);
                    loginBox.classList.remove('hidden');
                    btn.disabled = false;
                    handleAuthFailure();
                }
            } catch(e) {
                console.error(e);
                alert("通信エラーが発生しました");
                loadingMsg.classList.add('hidden');
                loginBox.classList.remove('hidden');
                btn.disabled = false;
            }
        }

        // 「抽選結果を表示」→ maxVotes 回分の一括抽選一覧 + 合計 + 候補一覧を表示
        document.getElementById('show-draw-btn').addEventListener('click', function() {
            if (!bundleData) return;
            this.classList.add('hidden');
            renderGachaBundle(document.getElementById('draw-list'), document.getElementById('total-weight'), bundleData);
            renderCandidates(bundleData.total_weight);
            document.getElementById('draw-area').classList.remove('hidden');
        });

        function renderCandidates(totalWeight) {
            var container = document.getElementById('candidates-list');
            container.innerHTML = "";

            if(candidatesData.length === 0) {
                container.innerHTML = "<p>現在投票可能な候補がありません。<br>管理者の更新をお待ちください。</p>";
                return;
            }

            var shuffled = shuffleArray([].concat(candidatesData));
            shuffled.forEach(function(item) {
                var div = document.createElement('div');
                div.className = 'candidate-card';
                div.innerHTML =
                    '<div class="card-info">' +
                        '<span class="badge">' + esc(item.character) + '</span><br>' +
                        '<strong>' + esc(item.theme) + '</strong><br>' +
                    '</div>' +
                    '<button class="vote-btn">投票</button>';
                div.querySelector('.vote-btn').addEventListener('click', function() {
                    submitVote(item.id, item.theme, totalWeight);
                });
                container.appendChild(div);
            });
        }

        async function submitVote(targetId, themeName, totalWeight) {
            if(!confirm('「' + themeName + '」に合計 ' + totalWeight + '票 を投票しますか？\n投票後の変更はできません。')) return;
            document.querySelectorAll('.vote-btn').forEach(function(b) { b.disabled = true; });
            try {
                var ip = await getIpAddress();
                var result = await apiPost({
                    action: 'submit_vote_variant',
                    pixiv_id: currentUser.pixiv_id,
                    user_name: localStorage.getItem('supporter_name'),
                    target_request_id: targetId,
                    password: localStorage.getItem('supporter_pass'),
                    device_uuid: getOrCreateUUID(),
                    ip_address: ip,
                    user_agent: navigator.userAgent
                });

                if (result.status === 'maintenance') {
                    showMaintenance(result.message);
                    return;
                }

                if(result.status === 'success') {
                    document.getElementById('vote-section').classList.add('hidden');
                    document.getElementById('done-section').classList.remove('hidden');
                } else {
                    alert("エラー: " + result.message);
                    location.reload();
                }
            } catch(e) {
                alert("通信エラー");
                location.reload();
            }
        }

    </script>
</body>
</html>
